<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Croatian tax lists, 1495–1596 — browse</title>
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/explorer.css">
</head>
<body>
<div class="wrap">
  <header class="head">
    <div class="head-titles">
      <h1>Croatian tax lists, 1495–1596</h1>
    </div>
    <div class="head-ctl">
      <a class="btn" href="index.html">Map</a>
      <button id="theme" class="hidden" type="button" hidden>Dark</button>
    </div>
  </header>

  <section class="panel">
    <form id="filters" class="filters" autocomplete="off">
      <div class="fg">
        <label for="f-year">Year</label>
        <select id="f-year" multiple aria-label="Filter by year"></select>
      </div>
      <div class="fg">
        <span class="label">County</span>
        <div id="f-county" class="checks" role="group" aria-label="Filter by county"></div>
      </div>
      <div class="fg">
        <span class="label">Tax type</span>
        <div id="f-tax" class="checks" role="group" aria-label="Filter by tax type"></div>
      </div>
      <div class="fg-group">
        <div class="fg-row fg-row-3">
          <div class="fg">
            <label for="f-place">Place (historical or modern)</label>
            <input id="f-place" type="text" placeholder="e.g. Zabok">
          </div>
          <div class="fg">
            <label for="f-person">Person (name or surname)</label>
            <input id="f-person" type="text" placeholder="e.g. Ivan">
          </div>
          <div class="fg">
            <label for="f-institution">Institution</label>
            <input id="f-institution" type="text" placeholder="e.g. chapter">
          </div>
        </div>
        <div class="fg-row">
          <div class="fg">
            <label for="f-tax-min">Taxable selišta (min)</label>
            <input id="f-tax-min" type="number" min="0" step="any">
          </div>
          <div class="fg">
            <label for="f-tax-max">Taxable selišta (max)</label>
            <input id="f-tax-max" type="number" min="0" step="any">
          </div>
        </div>
      </div>
    </form>

    <div class="bar">
      <span class="stat" id="stat">—</span>
      <div class="pager">
        <button type="button" id="pg-first" title="First page">«</button>
        <button type="button" id="pg-prev" title="Previous page">‹</button>
        <span id="pg-lab">—</span>
        <button type="button" id="pg-next" title="Next page">›</button>
        <button type="button" id="pg-last" title="Last page">»</button>
        <button type="button" id="export">Export CSV</button>
        <button type="button" id="reset">Reset filters</button>
      </div>
    </div>

    <div class="table-wrap">
      <table id="grid">
        <thead><tr id="head-row"></tr></thead>
        <tbody id="tbl-body"></tbody>
      </table>
    </div>
  </section>
</div>

<script>const DATA = /*__DATA__*/null;</script>
<script src="js/explorer.js"></script>
</body>
</html>
